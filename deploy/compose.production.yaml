name: academy-abrikosoff

services:
  migrate:
    image: ${ACADEMY_IMAGE:?ACADEMY_IMAGE must be set}
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    env_file:
      - ${ACADEMY_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${ACADEMY_IMAGE:?ACADEMY_IMAGE must be set}
    restart: unless-stopped
    env_file:
      - ${ACADEMY_ENV_FILE:-.env}
    environment:
      APP_VERSION: ${APP_VERSION:-development}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - edge
      - internal
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - academy_next_cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academy}
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - academy_database:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy_config:
  caddy_data:
  academy_database:
  academy_next_cache:
