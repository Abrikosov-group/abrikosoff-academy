name: academy-telegram-egress-tunnel

services:
  tunnel:
    image: ${TELEGRAM_EGRESS_IMAGE:?TELEGRAM_EGRESS_IMAGE must be set}
    command: ["tunnel"]
    restart: unless-stopped
    environment:
      TELEGRAM_EGRESS_LOCAL_PORT: ${TELEGRAM_EGRESS_LOCAL_PORT:-3128}
      TELEGRAM_EGRESS_REMOTE_PROXY_PORT: ${TELEGRAM_EGRESS_REMOTE_PROXY_PORT:-18083}
      TELEGRAM_EGRESS_SSH_HOST: ${TELEGRAM_EGRESS_SSH_HOST:?TELEGRAM_EGRESS_SSH_HOST must be set}
      TELEGRAM_EGRESS_SSH_PORT: ${TELEGRAM_EGRESS_SSH_PORT:-22}
      TELEGRAM_EGRESS_SSH_USER: ${TELEGRAM_EGRESS_SSH_USER:-academy-egress}
    expose:
      - "${TELEGRAM_EGRESS_LOCAL_PORT:-3128}"
    volumes:
      - type: bind
        source: ${TELEGRAM_EGRESS_SSH_KEY_FILE:?TELEGRAM_EGRESS_SSH_KEY_FILE must be set}
        target: /run/secrets/telegram-egress-ssh-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TELEGRAM_EGRESS_KNOWN_HOSTS_FILE:?TELEGRAM_EGRESS_KNOWN_HOSTS_FILE must be set}
        target: /run/secrets/telegram-egress-known-hosts
        read_only: true
        bind:
          create_host_path: false
    networks:
      academy_edge:
        aliases:
          - telegram-egress-tunnel
    read_only: true
    tmpfs:
      - /tmp:uid=0,gid=0,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 64m
    cpus: 0.10
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec curl --fail --silent --show-error --max-time 10 --proxy \"http://127.0.0.1:$${TELEGRAM_EGRESS_LOCAL_PORT}\" https://oauth.telegram.org/.well-known/openid-configuration",
        ]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

networks:
  academy_edge:
    external: true
    name: ${ACADEMY_EDGE_NETWORK:-academy-abrikosoff_edge}
