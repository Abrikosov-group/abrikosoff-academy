[Service]
Environment="ACTIONS_RUNNER_HOOK_JOB_STARTED=/usr/local/libexec/abrikosoff-academy-review/verify-job.sh"
Environment="ACTIONS_RUNNER_HOOK_JOB_COMPLETED=/usr/local/libexec/abrikosoff-academy-review/cleanup-model-job.sh"
Environment="EXPECTED_RUNNER_NAME=abrikosoff-academy-review-claude-01"
Environment="EXPECTED_RUNNER_TEMP=/var/lib/github-actions-runner-abrikosoff-academy-review-claude/_work/_temp"
Environment="PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
NoNewPrivileges=true
PrivateTmp=true
ProtectProc=invisible
ProtectSystem=full
ProtectHome=true
ReadWritePaths=/var/lib/github-actions-runner-abrikosoff-academy-review-claude /var/lib/abrikosoff-academy-review-claude
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
KillMode=control-group
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryMax=3G
CPUQuota=200%
TasksMax=384
UMask=0077
