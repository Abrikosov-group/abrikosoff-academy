name: Проверка проекта

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Код и production-сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Установить зависимости
        run: npm ci --strict-allow-scripts

      - name: Проверить код
        run: npm run lint

      - name: Проверить типы
        run: npm run typecheck

      - name: Проверить production-зависимости
        run: npm run audit:production

      - name: Собрать приложение
        run: npm run build
