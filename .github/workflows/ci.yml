name: Проверка проекта

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram-egress:
    name: Контур исходящих запросов Telegram
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверить сценарий запуска
        run: shellcheck deploy/telegram-egress/entrypoint

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Собрать образ Telegram-egress
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/telegram-egress
          file: ./deploy/telegram-egress/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: academy-telegram-egress:ci
          cache-from: type=gha,scope=telegram-egress
          cache-to: type=gha,mode=max,scope=telegram-egress

      - name: Проверить Squid и Compose
        env:
          ACADEMY_EDGE_NETWORK: academy-abrikosoff_edge
          TELEGRAM_EGRESS_IMAGE: academy-telegram-egress:ci
          TELEGRAM_EGRESS_KNOWN_HOSTS_FILE: /tmp/known_hosts
          TELEGRAM_EGRESS_LOCAL_PORT: 3210
          TELEGRAM_EGRESS_SSH_HOST: 192.0.2.1
          TELEGRAM_EGRESS_SSH_KEY_FILE: /tmp/id_ed25519
        run: |
          docker run \
            --rm \
            --read-only \
            --tmpfs /tmp:uid=31,gid=31,mode=0700 \
            --user 31:31 \
            academy-telegram-egress:ci \
            squid -k parse -f /etc/squid/squid.conf

          docker compose \
            -f deploy/telegram-egress/compose.remote.yaml \
            config --quiet

          tunnel_config="$(
            docker compose \
              -f deploy/telegram-egress/compose.tunnel.yaml \
              config
          )"
          grep -Fq 'http://127.0.0.1:3210' <<< "$tunnel_config"
          grep -Fq 'create_host_path: false' <<< "$tunnel_config"

  quality:
    name: Код, тесты и production-сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://academy_test:academy-test-only@127.0.0.1:5432/academy_test
    services:
      postgres:
        image: postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
        env:
          POSTGRES_DB: academy_test
          POSTGRES_PASSWORD: academy-test-only
          POSTGRES_USER: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy_test -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверить серверные сценарии
        run: |
          bash -n deploy/server/academy-postgres-backup
          bash -n deploy/server/academy-postgres-offsite-backup
          bash -n deploy/server/academy-backup-monitor
          shellcheck \
            deploy/server/academy-postgres-backup \
            deploy/server/academy-postgres-offsite-backup \
            deploy/server/academy-backup-monitor

          set +e
          smoke_output="$(
            ACADEMY_BACKUP_ROOT="$RUNNER_TEMP/missing-backups" \
              deploy/server/academy-postgres-offsite-backup 2>&1
          )"
          smoke_exit=$?
          set -e

          test "$smoke_exit" -eq 1
          grep -Fq 'last-success не найден' <<< "$smoke_output"

          monitor_root="$RUNNER_TEMP/monitor-backups"
          mkdir -p "$monitor_root"
          monitor_now=1785153600
          monitor_archive=academy-20260727T140000Z.dump
          printf 'test backup\n' > "$monitor_root/$monitor_archive"
          monitor_sha="$(
            sha256sum "$monitor_root/$monitor_archive" | awk '{print $1}'
          )"
          monitor_size="$(stat -c '%s' "$monitor_root/$monitor_archive")"
          printf '%s  %s\n' \
            "$monitor_sha" \
            "$monitor_archive" \
            > "$monitor_root/$monitor_archive.sha256"
          ln -s "$monitor_archive" "$monitor_root/latest.dump"
          ln -s "$monitor_archive.sha256" "$monitor_root/latest.dump.sha256"

          {
            printf 'completed_at=%s\n' \
              "$(date -u -d "@$((monitor_now - 3600))" --iso-8601=seconds)"
            printf 'archive=%s\n' "$monitor_archive"
            printf 'sha256=%s\n' "$monitor_sha"
            printf 'size_bytes=%s\n' "$monitor_size"
            printf 'source_objects=5\n'
            printf 'restored_objects=5\n'
            printf 'restore_verified=true\n'
            printf 'postgres_version=pg_dump (PostgreSQL) 17\n'
          } > "$monitor_root/last-success"

          {
            printf 'uploaded_at=%s\n' \
              "$(date -u -d "@$((monitor_now - 3500))" --iso-8601=seconds)"
            printf 'bucket=abrikosoff-academy-backups-prod-2026\n'
            printf 'object_key=postgres/2026/07/%s.age\n' "$monitor_archive"
            printf 'version_id=test-version\n'
            printf 'source_archive=%s\n' "$monitor_archive"
            printf 'source_sha256=%s\n' "$monitor_sha"
            printf 'encrypted_sha256=%064d\n' 0
            printf 'encrypted_size_bytes=%s\n' "$((monitor_size + 128))"
            printf 'object_lock_mode=COMPLIANCE\n'
            printf 'retain_until=%s\n' \
              "$(date -u -d "@$((monitor_now + 35 * 86400))" --iso-8601=seconds)"
            printf 'download_verified=true\n'
          } > "$monitor_root/last-offsite-success"

          ACADEMY_BACKUP_ROOT="$monitor_root" \
            ACADEMY_MONITOR_NOW_EPOCH="$monitor_now" \
            deploy/server/academy-backup-monitor

          set +e
          stale_output="$(
            ACADEMY_BACKUP_ROOT="$monitor_root" \
              ACADEMY_MONITOR_NOW_EPOCH="$((monitor_now + 31 * 3600))" \
              deploy/server/academy-backup-monitor 2>&1
          )"
          stale_exit=$?
          set -e

          test "$stale_exit" -eq 1
          grep -Fq 'локальная резервная копия старше допустимых' \
            <<< "$stale_output"

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Установить зависимости
        run: npm ci --strict-allow-scripts

      - name: Проверить код
        run: npm run lint

      - name: Проверить типы
        run: npm run typecheck

      - name: Выполнить модульные тесты
        run: npm run test:unit

      - name: Выполнить интеграционные тесты с PostgreSQL
        run: npm run test:integration

      - name: Проверить production-зависимости
        run: npm run audit:production

      - name: Собрать приложение
        run: npm run build

      - name: Установить Chromium для браузерных тестов
        run: npx playwright install --with-deps chromium

      - name: Выполнить сквозной тест подписки и доступа
        run: npm run test:e2e

      - name: Убедиться, что тесты не изменили исходный код
        run: git diff --exit-code
