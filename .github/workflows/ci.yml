name: Проверка проекта

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  administration-wrapper:
    name: Production-wrapper Administration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверить allowlist-wrapper
        run: |
          bash -n deploy/server/academy-admin
          bash -n deploy/server/academy-release
          bash -n deploy/server/academy-task
          bash -n tests/server/academy-admin-wrapper.sh
          shellcheck deploy/server/academy-admin
          shellcheck deploy/server/academy-release
          shellcheck deploy/server/academy-task
          shellcheck tests/server/academy-admin-wrapper.sh

      - name: Проверить fail-closed согласованность production-релиза
        run: |
          docker run \
            --rm \
            --network none \
            --read-only \
            --tmpfs /opt:mode=0755 \
            --tmpfs /tmp:mode=1777 \
            --volume "$PWD:/workspace:ro" \
            ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            bash /workspace/tests/server/academy-admin-wrapper.sh

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Собрать production-образ приложения
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: academy-app:admin-wrapper-ci
          cache-from: type=gha,scope=administration-wrapper
          cache-to: type=gha,mode=max,scope=administration-wrapper

      - name: Проверить доставку wrapper-ов в образе
        run: |
          for wrapper_name in academy-admin academy-release academy-task; do
            expected_sha="$(
              sha256sum "deploy/server/${wrapper_name}" | awk '{print $1}'
            )"
            actual_sha="$(
              docker run \
                --rm \
                --entrypoint sha256sum \
                academy-app:admin-wrapper-ci \
                "/usr/local/share/academy/${wrapper_name}" \
                | awk '{print $1}'
            )"
            actual_mode="$(
              docker run \
                --rm \
                --entrypoint stat \
                academy-app:admin-wrapper-ci \
                -c '%a' \
                "/usr/local/share/academy/${wrapper_name}"
            )"
            actual_owner="$(
              docker run \
                --rm \
                --entrypoint stat \
                academy-app:admin-wrapper-ci \
                -c '%u:%g' \
                "/usr/local/share/academy/${wrapper_name}"
            )"

            test "$actual_sha" = "$expected_sha"
            test "$actual_mode" = 555
            test "$actual_owner" = 0:0
          done

      - name: Проверить CLI внутри собранного образа
        run: |
          help_output="$(
            docker run \
              --rm \
              academy-app:admin-wrapper-ci \
              node scripts/academy-admin.mjs --help
          )"
          grep -Fq 'Управление административным контуром Академии' \
            <<< "$help_output"

          set +e
          guard_output="$(
            docker run \
              --rm \
              --env NODE_ENV=production \
              academy-app:admin-wrapper-ci \
              node scripts/academy-admin.mjs \
                grant \
                --user-id 11111111-1111-4111-8111-111111111111 \
                --role owner \
                --reason 'Проверка production-флага wrapper' \
                --idempotency-key 22222222-2222-4222-8222-222222222222 \
                2>&1
          )"
          guard_exit=$?
          set -e

          test "$guard_exit" -eq 2
          grep -Fq 'PRODUCTION_CONFIRMATION_REQUIRED' <<< "$guard_output"

          set +e
          release_gate_output="$(
            docker run \
              --rm \
              --env NODE_ENV=production \
              --env ADMINISTRATION_ENABLED=true \
              academy-app:admin-wrapper-ci \
              node scripts/academy-admin.mjs \
                grant \
                --user-id 11111111-1111-4111-8111-111111111111 \
                --role owner \
                --reason 'Проверка закрытого production-гейта' \
                --idempotency-key 33333333-3333-4333-8333-333333333333 \
                --production \
                2>&1
          )"
          release_gate_exit=$?
          set -e

          test "$release_gate_exit" -eq 2
          grep -Fq 'ADMINISTRATION_GATE_MUST_BE_DISABLED' \
            <<< "$release_gate_output"

  telegram-egress:
    name: Контур исходящих запросов Telegram
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверить сценарий запуска
        run: shellcheck deploy/telegram-egress/entrypoint

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Собрать образ Telegram-egress
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/telegram-egress
          file: ./deploy/telegram-egress/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: academy-telegram-egress:ci
          cache-from: type=gha,scope=telegram-egress
          cache-to: type=gha,mode=max,scope=telegram-egress

      - name: Проверить Squid и Compose
        env:
          ACADEMY_EDGE_NETWORK: academy-abrikosoff_edge
          TELEGRAM_EGRESS_IMAGE: academy-telegram-egress:ci
          TELEGRAM_EGRESS_KNOWN_HOSTS_FILE: /tmp/known_hosts
          TELEGRAM_EGRESS_LOCAL_PORT: 3210
          TELEGRAM_EGRESS_SSH_HOST: 192.0.2.1
          TELEGRAM_EGRESS_SSH_KEY_FILE: /tmp/id_ed25519
        run: |
          docker run \
            --rm \
            --read-only \
            --tmpfs /tmp:uid=31,gid=31,mode=0700 \
            --user 31:31 \
            academy-telegram-egress:ci \
            squid -k parse -f /etc/squid/squid.conf

          docker compose \
            -f deploy/telegram-egress/compose.remote.yaml \
            config --quiet

          tunnel_config="$(
            docker compose \
              -f deploy/telegram-egress/compose.tunnel.yaml \
              config --format json
          )"
          jq -e \
            '.services.tunnel.healthcheck.test
              | index("http://127.0.0.1:3210")' \
            <<< "$tunnel_config"
          jq -e \
            '[.services.tunnel.secrets[].source] | sort
              == [
                "telegram_egress_known_hosts",
                "telegram_egress_ssh_key"
              ]' \
            <<< "$tunnel_config"
          jq -e \
            '.secrets.telegram_egress_known_hosts.file
                == "/tmp/known_hosts"
              and .secrets.telegram_egress_ssh_key.file
                == "/tmp/id_ed25519"' \
            <<< "$tunnel_config"

          test ! -e "$TELEGRAM_EGRESS_KNOWN_HOSTS_FILE"
          test ! -e "$TELEGRAM_EGRESS_SSH_KEY_FILE"
          docker network create "$ACADEMY_EDGE_NETWORK" >/dev/null
          set +e
          create_output="$(
            docker compose \
              -f deploy/telegram-egress/compose.tunnel.yaml \
              create 2>&1
          )"
          create_exit=$?
          set -e
          docker compose \
            -f deploy/telegram-egress/compose.tunnel.yaml \
            down --remove-orphans >/dev/null 2>&1 || true
          docker network rm "$ACADEMY_EDGE_NETWORK" >/dev/null

          test "$create_exit" -ne 0
          grep -Fq 'bind source path does not exist' <<< "$create_output"
          test ! -e "$TELEGRAM_EGRESS_KNOWN_HOSTS_FILE"
          test ! -e "$TELEGRAM_EGRESS_SSH_KEY_FILE"

  quality:
    name: Код, тесты и production-сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://academy_test:academy-test-only@127.0.0.1:5432/academy_test
    services:
      postgres:
        image: postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
        env:
          POSTGRES_DB: academy_test
          POSTGRES_PASSWORD: academy-test-only
          POSTGRES_USER: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy_test -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверить серверные сценарии
        run: |
          bash -n deploy/server/academy-postgres-backup
          bash -n deploy/server/academy-postgres-offsite-backup
          bash -n deploy/server/academy-backup-monitor
          shellcheck \
            deploy/server/academy-postgres-backup \
            deploy/server/academy-postgres-offsite-backup \
            deploy/server/academy-backup-monitor

          set +e
          smoke_output="$(
            ACADEMY_BACKUP_ROOT="$RUNNER_TEMP/missing-backups" \
              deploy/server/academy-postgres-offsite-backup 2>&1
          )"
          smoke_exit=$?
          set -e

          test "$smoke_exit" -eq 1
          grep -Fq 'last-success не найден' <<< "$smoke_output"

          monitor_root="$RUNNER_TEMP/monitor-backups"
          mkdir -p "$monitor_root"
          monitor_now=1785153600
          monitor_archive=academy-20260727T140000Z.dump
          printf 'test backup\n' > "$monitor_root/$monitor_archive"
          monitor_sha="$(
            sha256sum "$monitor_root/$monitor_archive" | awk '{print $1}'
          )"
          monitor_size="$(stat -c '%s' "$monitor_root/$monitor_archive")"
          printf '%s  %s\n' \
            "$monitor_sha" \
            "$monitor_archive" \
            > "$monitor_root/$monitor_archive.sha256"
          ln -s "$monitor_archive" "$monitor_root/latest.dump"
          ln -s "$monitor_archive.sha256" "$monitor_root/latest.dump.sha256"

          {
            printf 'completed_at=%s\n' \
              "$(date -u -d "@$((monitor_now - 3600))" --iso-8601=seconds)"
            printf 'archive=%s\n' "$monitor_archive"
            printf 'sha256=%s\n' "$monitor_sha"
            printf 'size_bytes=%s\n' "$monitor_size"
            printf 'source_objects=5\n'
            printf 'restored_objects=5\n'
            printf 'restore_verified=true\n'
            printf 'postgres_version=pg_dump (PostgreSQL) 17\n'
          } > "$monitor_root/last-success"

          {
            printf 'uploaded_at=%s\n' \
              "$(date -u -d "@$((monitor_now - 3500))" --iso-8601=seconds)"
            printf 'bucket=abrikosoff-academy-backups-prod-2026\n'
            printf 'object_key=postgres/2026/07/%s.age\n' "$monitor_archive"
            printf 'version_id=test-version\n'
            printf 'source_archive=%s\n' "$monitor_archive"
            printf 'source_sha256=%s\n' "$monitor_sha"
            printf 'encrypted_sha256=%064d\n' 0
            printf 'encrypted_size_bytes=%s\n' "$((monitor_size + 128))"
            printf 'object_lock_mode=COMPLIANCE\n'
            printf 'retain_until=%s\n' \
              "$(date -u -d "@$((monitor_now + 35 * 86400))" --iso-8601=seconds)"
            printf 'download_verified=true\n'
          } > "$monitor_root/last-offsite-success"

          ACADEMY_BACKUP_ROOT="$monitor_root" \
            ACADEMY_MONITOR_NOW_EPOCH="$monitor_now" \
            deploy/server/academy-backup-monitor

          set +e
          stale_output="$(
            ACADEMY_BACKUP_ROOT="$monitor_root" \
              ACADEMY_MONITOR_NOW_EPOCH="$((monitor_now + 31 * 3600))" \
              deploy/server/academy-backup-monitor 2>&1
          )"
          stale_exit=$?
          set -e

          test "$stale_exit" -eq 1
          grep -Fq 'локальная резервная копия старше допустимых' \
            <<< "$stale_output"

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Установить зависимости
        run: npm ci --strict-allow-scripts

      - name: Проверить код
        run: npm run lint

      - name: Проверить типы
        run: npm run typecheck

      - name: Выполнить модульные тесты
        run: npm run test:unit

      - name: Выполнить интеграционные тесты с PostgreSQL
        run: npm run test:integration

      - name: Проверить production-зависимости
        run: npm run audit:production

      - name: Собрать приложение
        run: npm run build

      - name: Установить Chromium для браузерных тестов
        run: npx playwright install --with-deps chromium

      - name: Выполнить сквозной тест подписки и доступа
        run: npm run test:e2e

      - name: Убедиться, что тесты не изменили исходный код
        run: git diff --exit-code

  release-train-gate:
    name: Начальный шлюз релизного поезда
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Проверить синтаксис управляющих сценариев
        run: |
          for script in scripts/release-train/*.mjs; do
            node --check "$script"
          done

      - name: Проверить контракты начального шлюза
        run: node --test tests/release-train/*.test.mjs
