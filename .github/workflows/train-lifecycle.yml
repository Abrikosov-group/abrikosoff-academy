name: Жизненный цикл релизного поезда

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Введите «ОТКРЫТЬ РЕЛИЗНЫЙ ПОЕЗД»
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  team-private-guard:
    name: Остановить недоступный Actions-шлюз
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Закрыть небезопасный путь к private key
        env:
          TRAIN_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$TRAIN_CONFIRMATION" != "ОТКРЫТЬ РЕЛИЗНЫЙ ПОЕЗД" ]; then
            echo "::error title=Неверное подтверждение::Текст подтверждения не совпадает."
            exit 1
          fi
          echo "::error title=GitHub Team/private::Private key не хранится в GitHub Environment. Выполните локальный owner-шлюз по docs/operations/release-train.md."
          exit 1
