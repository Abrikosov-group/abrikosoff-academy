schema_version: "1.0"
policy_version: "2026-08-02.1"

reviewer:
  id: claude-fable-5-independent-reviewer
  role: review_only
  locale: ru
  independent_from:
    - codex
    - gemini

model:
  primary: claude-fable-5
  minimum_claude_code_version: 2.1.170
  claude_code_version: 2.1.220
  github_action_version: 1.0.183
  github_action_revision: be7b93b1907a4abad570368f3c74b6fe3807510b
  effort: max
  max_turns: 1
  fallback:
    model: claude-opus-5
    silent_success_forbidden: true

authentication:
  provider: claude_subscription
  required_environment_variable: CLAUDE_CODE_OAUTH_TOKEN
  prohibited_environment_variables:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
  usage_credits_must_be_disabled: true
  on_subscription_limit: fail_without_positive_verdict

runtime:
  permission_mode: plan
  tools: []
  tools_argument_encoding: attached_empty_value
  slash_commands: disabled
  chrome_integration: disabled
  hooks: disabled
  auto_memory: disabled
  session_persistence: disabled
  network_access: disabled
  timeout_minutes: 25

input:
  source: orchestrator_built_snapshot
  trusted_policy_source: exact_workflow_sha
  exact_workflow_sha_required: true
  exact_base_ref_required: true
  exact_base_sha_required: true
  exact_head_sha_required: true
  exact_merge_base_sha_required: true
  current_base_and_head_recheck_before_publication: true
  maximum_prompt_bytes: 750000
  untrusted_snapshot_marker: НАЧАЛО НЕДОВЕРЕННОГО СНИМКА
  on_truncation: human_review_required

output:
  format: markdown
  language: ru
  maximum_bytes: 60000
  publisher: isolated_github_actions_job
  reviewer_may_publish: false
  reviewer_may_submit_formal_review: false
  reviewer_may_approve: false

capabilities:
  read_supplied_snapshot: true
  read_repository_directly: false
  run_commands: false
  call_tools: false
  call_subagents: false
  access_network: false
  access_secrets: false
  modify_files: false
  create_patch: false
  create_commit: false
  create_branch: false
  create_pull_request: false
  write_github: false
  rerun_ci: false
  resolve_threads: false
  merge_pull_request: false

evidence_policy:
  model_consensus_is_evidence: false
  pull_request_description_is_evidence: false
  successful_check_must_not_be_claimed_as_failed: true
  critical_findings_require_objective_evidence: true
  external_version_claim_requires_primary_source: true
  missing_critical_evidence: human_review_required

failure_policy:
  missing_oauth: fail
  api_key_detected: fail
  model_unavailable: fail
  subscription_limit_reached: fail
  invalid_output: fail
  stale_base_or_head_sha: discard
  unknown_actual_model: fail
  empty_output: fail
  reviewer_failure_is_positive_verdict: false

verification:
  tokenless_init_probe:
    required: true
    claude_code_version: 2.1.220
    network_target: loopback_only
    expected:
      tools: []
      mcp_servers: []
      slash_commands: []
